theme: jekyll-theme-chirpy
lang: en
timezone: Asia/Seoul
title: Personal Blog
tagline: ''
description: Notes on learning, reflections on life, and stories from the trail.
url: https://sehyeogkim.github.io
github:
  username: Sehyeogkim
twitter:
  username: say_hugk99
social:
  name: Sehyeog Kim
  links:
  - https://github.com/Sehyeogkim
  - https://www.linkedin.com/in/sehyeog-kim-5a1131265
  - https://x.com/say_hugk99
  - https://www.instagram.com/say_hugk/
webmaster_verifications:
  google: null
  bing: null
  alexa: null
  yandex: null
  baidu: null
  facebook: null
analytics:
  google:
    id: null
  goatcounter:
    id: null
  umami:
    id: null
    domain: null
  matomo:
    id: null
    domain: null
  cloudflare:
    id: null
  fathom:
    id: null
pageviews:
  provider: null
theme_mode: null
cdn: ''
avatar: /assets/images/profile-selfie.jpg
social_preview_image: null
toc: true
actions:
  edit_post:
    enabled: false
    url: ''
    static_url: false
comments:
  provider: null
  disqus:
    shortname: null
  utterances:
    repo: null
    issue_term: null
  giscus:
    repo: null
    repo_id: null
    category: null
    category_id: null
    mapping: null
    strict: null
    input_position: null
    lang: null
    reactions_enabled: null
assets:
  self_host:
    enabled: null
    env: null
pwa:
  enabled: false
  cache:
    enabled: false
paginate: 12
baseurl: ''
kramdown:
  footnote_backlink: '&#8617;&#xfe0e;'
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
collections:
  tabs:
    output: true
    sort_by: order
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    comments: false
    toc: true
    permalink: /posts/:title/
    math: true
    section: Study
    journal: true
- scope:
    path: _drafts
  values:
    comments: false
- scope:
    path: ''
    type: tabs
  values:
    layout: page
    permalink: /:title/
sass:
  style: compressed
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
    - development
exclude:
- '*.gem'
- '*.gemspec'
- docs
- tools
- README.md
- LICENSE
- purgecss.js
- '*.config.js'
- package*.json
- AGENTS.md
- agents
- bin
- validation
- vendor
- node_modules
- Gemfile
- Gemfile.lock
- scripts
- content.txt
- blog_data
- plan_github.txt
- .github
jekyll-archives:
  enabled:
  - categories
  - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
alt_lang: en
plugins:
- jekyll-paginate
- jekyll-sitemap
- jekyll-seo-tag
- jekyll-archives
- jekyll-include-cache
