remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: default
title: "Personal Blog"
name: "Sehyeog Kim"
description: "공부하며 이해한 것들, 살아가며 생각한 것들, 그리고 길 위의 기록."
url: "https://sehyeogkim.github.io"
baseurl: ""
repository: "Sehyeogkim/Sehyeogkim.github.io"
locale: "ko-KR"
timezone: "Asia/Seoul"
author:
  name: "Sehyeog Kim"
  avatar: "/assets/images/profile.jpg"
  bio: "Engineering, AI, and life beyond the desk."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Sehyeogkim"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/sehyeog-kim-5a1131265"
    - label: "X"
      icon: "fab fa-fw fa-twitter"
      url: "https://x.com/say_hugk99"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://www.instagram.com/say_hugk/"
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Sehyeogkim"
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
highlighter: rouge
permalink: /:categories/:title/
defaults:
  - scope:
      path: ""
    values:
      author_profile: true
  - scope:
      path: ""
      type: posts
    values:
      layout: note
      journal: true
      section: Study
      read_time: true
      show_date: true
exclude:
  - AGENTS.md
  - agents
  - bin
  - tools
  - validation
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts
  - content.txt
  - blog_data
  - plan_github.txt
  - package.json
  - package-lock.json
  - .github
