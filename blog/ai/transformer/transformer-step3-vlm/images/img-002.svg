<svg width="380" height="494" viewBox="0 0 380 494" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How an image becomes patch tokens</title>
<desc>A 512 pixel image is cut on a 16 pixel grid into 1024 patches, and each patch's 768 raw values become a 768 dimensional vector.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .grid { stroke: #D5D1C7; stroke-width: 0.5; fill: none; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#8A867C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="380" height="494" fill="#FFFFFF"/>

<text class="ts" x="190" y="38" text-anchor="middle" fill="#5C584E">(B, 3, 512, 512)</text>

<rect x="130" y="50" width="120" height="120" rx="4" fill="#FAFAF7" stroke="#D5D1C7" stroke-width="0.5"/>
<rect x="175" y="80" width="15" height="15" fill="#FDECE8" stroke="#C4553D" stroke-width="0.5"/>
<line x1="145" y1="50" x2="145" y2="170" class="grid"/>
<line x1="160" y1="50" x2="160" y2="170" class="grid"/>
<line x1="175" y1="50" x2="175" y2="170" class="grid"/>
<line x1="190" y1="50" x2="190" y2="170" class="grid"/>
<line x1="205" y1="50" x2="205" y2="170" class="grid"/>
<line x1="220" y1="50" x2="220" y2="170" class="grid"/>
<line x1="235" y1="50" x2="235" y2="170" class="grid"/>
<line x1="130" y1="65" x2="250" y2="65" class="grid"/>
<line x1="130" y1="80" x2="250" y2="80" class="grid"/>
<line x1="130" y1="95" x2="250" y2="95" class="grid"/>
<line x1="130" y1="110" x2="250" y2="110" class="grid"/>
<line x1="130" y1="125" x2="250" y2="125" class="grid"/>
<line x1="130" y1="140" x2="250" y2="140" class="grid"/>
<line x1="130" y1="155" x2="250" y2="155" class="grid"/>

<text class="ts" x="190" y="192" text-anchor="middle" fill="#5C584E">512 &#247; 16 = 32, so 32 &#215; 32 = 1024 patches</text>

<line x1="190" y1="204" x2="190" y2="226" stroke="#8A867C" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="228" width="300" height="60" rx="8" fill="#FDECE8" stroke="#C4553D" stroke-width="0.5"/>
<text class="th" x="190" y="255" text-anchor="middle" fill="#8F3D2B">Values inside one patch</text>
<text class="ts" x="190" y="276" text-anchor="middle" fill="#A9553F">16 &#215; 16 &#215; 3 = 768 numbers</text>

<line x1="190" y1="288" x2="190" y2="314" stroke="#8A867C" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="316" width="300" height="60" rx="8" fill="#F1EFE8" stroke="#B8B3A6" stroke-width="0.5"/>
<text class="th" x="190" y="343" text-anchor="middle" fill="#3A372F">Conv2d = a Linear per patch</text>
<text class="ts" x="190" y="364" text-anchor="middle" fill="#5C584E">768 numbers &#8594; a 768-dim vector</text>

<line x1="190" y1="376" x2="190" y2="402" stroke="#8A867C" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="404" width="300" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text class="th" x="190" y="431" text-anchor="middle" fill="#3F399C">(B, 1024, 768)</text>
<text class="ts" x="190" y="452" text-anchor="middle" fill="#5D57BE">1024 patches, 768 dims each</text>
</svg>
