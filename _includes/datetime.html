{%- comment -%}Keep publication calendar dates stable across readers' time zones.{%- endcomment -%}
{% assign df_strftime = site.data.locales[include.lang].df.post.strftime | default: '%b %d, %Y' %}
<time datetime="{{ include.date | date_to_xmlschema }}"{% if include.class %} class="{{ include.class }}"{% endif %}{% if include.tooltip %} title="{{ include.date | date: '%Y-%m-%d' }}"{% endif %}>{{ include.date | date: df_strftime }}</time>
