{% assign entry = include.entry %}
<article class="card-wrapper card journal-card" data-journal-card data-search="{{ entry.title | append: ' ' | append: entry.topic | append: ' ' | append: entry.study_area | append: ' ' | append: entry.section | append: ' ' | append: entry.description | strip_html | escape }}">
  <a href="{{ entry.url | relative_url }}" class="post-preview row g-0 flex-md-row-reverse">
    {% if entry.image %}<div class="col-md-5"><img src="{{ entry.image.path | default: entry.image | relative_url }}" alt="" loading="lazy"></div>{% endif %}
    <div class="{% if entry.image %}col-md-7{% else %}col-12{% endif %}">
      <div class="card-body d-flex flex-column">
        <h2 class="card-title my-2 mt-md-0">{{ entry.title }}</h2>
        <div class="card-text content mt-0 mb-3"><p>{{ entry.description | default: entry.excerpt | strip_html | truncate: 160 }}</p></div>
        <div class="post-meta flex-grow-1 d-flex align-items-end">
          <div class="me-auto"><i class="far fa-calendar fa-fw me-1"></i><time>{{ entry.date | date: '%b %d, %Y' }}</time>
            <i class="far fa-folder-open fa-fw me-1 ms-2"></i><span>{{ entry.section }}{% if entry.study_area %}, {{ entry.study_area }}{% endif %}</span>
          </div>
        </div>
      </div>
    </div>
  </a>
</article>
